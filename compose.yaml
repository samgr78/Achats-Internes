services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: achats_internes
      MYSQL_USER: achats
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-uachats"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: achats_internes
      DB_USERNAME: achats
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
